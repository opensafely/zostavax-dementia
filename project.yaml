version: '5.0'

actions:
  # Zostavax primary analysis based around threshold date of 2013-09-01
  generate_dataset_zostavax_main:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py 
      --output output/zostavax/dataset_zostavax_main.arrow
      --dummy-data-file analysis/dummy_data/dummy_dataset_zostavax.arrow
      --
      --threshold_date "2013-09-01"
      --index_date "2014-02-01"
      --min_dob "1920-09-01"
      --max_dob "1948-09-01"
      --vaccine_name "zostavax"
    outputs:
      highly_sensitive:
        dataset: output/zostavax/dataset_zostavax_main.arrow

  # Zostavax sensitivity analysis - 2010
  generate_dataset_zostavax_2010:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py 
      --output output/zostavax/dataset_zostavax_2010.arrow
      --
      --threshold_date "2010-09-01"
      --index_date "2011-02-01"
      --min_dob "1920-09-01"
      --max_dob "1948-09-01"
      --vaccine_name "zostavax"
    outputs:
      highly_sensitive:
        dataset: output/zostavax/dataset_zostavax_2010.arrow

  # Zostavax sensitivity analysis - 2016
  generate_dataset_zostavax_2016:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py 
      --output output/zostavax/dataset_zostavax_2016.arrow
      --
      --threshold_date "2016-09-01"
      --index_date "2017-02-01"
      --min_dob "1920-09-01"
      --max_dob "1948-09-01"
      --vaccine_name "zostavax"
    outputs:
      highly_sensitive:
        dataset: output/zostavax/dataset_zostavax_2016.arrow

  process_zostavax:
    run: r:v2 analysis/zostavax/0_zostavax_processing.R
    needs: [generate_dataset_zostavax_main, generate_dataset_zostavax_2010, generate_dataset_zostavax_2016]
    outputs:
      highly_sensitive:
        data1: output/zostavax/processed/dataset_processed_zostavax_main.arrow
        data2: output/zostavax/processed/dataset_processed_zostavax_2010.arrow
        data3: output/zostavax/processed/dataset_processed_zostavax_2016.arrow

  flow_chart_zostavax:
    run: r:v2 analysis/zostavax/1_zostavax_flow_chart.R
    needs: [process_zostavax]
    outputs:
      moderately_sensitive:
        data1: output/zostavax/processed/flow_chart_zostavax_main.csv
        data2: output/zostavax/processed/flow_chart_zostavax_2010.csv
        data3: output/zostavax/processed/flow_chart_zostavax_2016.csv

  
