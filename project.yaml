version: '5.0'

actions:
  generate_dataset_shingrix:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_shingrix.py 
      --output output/shingrix/dataset_shingrix.csv.gz
      -- 
      --index_date "2013-01-01"
    outputs:
      highly_sensitive:
        dataset: output/shingrix/dataset_shingrix.csv.gz

  # first sensitivity analysis - 3 years before
  generate_dataset_shingrix_sens_1:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_shingrix.py 
      --output output/shingrix/dataset_shingrix_sens_1.csv.gz
      -- 
      --index_date "2011-01-01"
    outputs:
      highly_sensitive:
        dataset: output/shingrix/dataset_shingrix_sens_1.csv.gz

  generate_dataset_shingrix_sens_2:
    run: ehrql:v1 generate-dataset analysis/dataset_definition_shingrix.py 
      --output output/shingrix/dataset_shingrix_sens_2.csv.gz
      -- 
      --index_date "2016-01-01"
    outputs:
      highly_sensitive:
        dataset: output/shingrix/dataset_shingrix_sens_2.csv.gz

