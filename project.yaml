version: '5.0'

actions:

  ## # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  ## DO NOT EDIT project.yaml DIRECTLY 
  ## This file is created by create_project_actions.R 
  ## Edit and run create_project_actions.R to update the project.yaml 
  ## # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  ## Generate dataset 

  generate_dataset_zostavax_main:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py 
      --output output/zostavax/dataset_zostavax_main.arrow
      --dummy-data-file analysis/dummy_data/dummy_dataset_zostavax.arrow
      --
      --threshold_date "2013-09-01"
      --min_dob "1920-09-01" 
      --max_dob "1948-09-01"
      --vaccine_name "zostavax"
    outputs:
      highly_sensitive:
        dataset: output/zostavax/dataset_zostavax_main.arrow

  # Zostavax sensitivity analysis - 2010
  generate_dataset_zostavax_2010:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py 
      --output output/zostavax/dataset_zostavax_2010.arrow
      --
      --threshold_date "2010-09-01"
      --min_dob "1920-09-01"
      --max_dob "1948-09-01"
      --vaccine_name "zostavax"
    outputs:
      highly_sensitive:
        dataset: output/zostavax/dataset_zostavax_2010.arrow

  # Zostavax sensitivity analysis - 2016
  generate_dataset_zostavax_2016:
    run: ehrql:v1 generate-dataset analysis/dataset_definition.py 
      --output output/zostavax/dataset_zostavax_2016.arrow
      --
      --threshold_date "2016-09-01"
      --min_dob "1920-09-01"
      --max_dob "1948-09-01"
      --vaccine_name "zostavax"
    outputs:
      highly_sensitive:
        data: output/zostavax/dataset_zostavax_main.arrow

  ## Process dataset 

  process_zostavax:
    run: r:v2 analysis/zostavax/0_zostavax_processing.R
    needs:
    - generate_dataset_zostavax_main
    outputs:
      highly_sensitive:
        processed_data: output/zostavax/processed/dataset_processed_zostavax_main.arrow

  ## Flow chart 

  flow_chart_zostavax:
    run: r:v2 analysis/zostavax/1_zostavax_flow_chart.R
    needs:
    - process_zostavax
    outputs:
      moderately_sensitive:
        flow_chart: output/zostavax/processed/flow_chart_zostavax_main.csv

  ## Descriptives 

  descriptives_zostavax:
    run: r:v2 analysis/zostavax/2_zostavax_descriptives.R
    needs:
    - process_zostavax
    outputs:
      moderately_sensitive:
        txt: output/zostavax/descriptives/main/*.txt
        csv: output/zostavax/descriptives/main/*.csv
        png: output/zostavax/descriptives/main/*.png

  ################################################################\

